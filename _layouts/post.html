---
layout: default
---
<article class="post">
  <p class="kicker">{{ page.date | date: "%B %-d, %Y" }} · {{ page.reading_time }} min read</p>
  <h1>{{ page.title }}</h1>
  {% if page.subtitle %}<p class="dek">{{ page.subtitle }}</p>{% endif %}
  <div class="body">
    {{ content }}
  </div>
</article>
